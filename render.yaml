# Render Blueprint — deploys the whole PulseHR live demo (web app + API) as ONE free service.
#
# Why no `databases:` block any more: Render's free PostgreSQL instances expire 30 days after
# creation and are then deleted. The one this blueprint provisioned on 15 Aug 2026 did exactly
# that, and because DATABASE_URL still pointed at it, the API could no longer start -- which
# took the GitHub Pages demo down with it. Free *web services* do not expire, so the demo now
# runs on the zero-install SQLite path (ADR-009) by default: the disk is ephemeral, so every
# restart reseeds deterministic demo data, then scores attrition and runs last month's payroll
# (scripts/demo.mjs) before the first request is served.
#
# PostgreSQL is still supported: set DATABASE_URL in the Render dashboard to any external
# Postgres (e.g. a free Neon or Supabase database, which do not expire) and db.ts switches to
# it automatically. Leave it unset for SQLite.
#
# `npm run build` builds the React app; server.ts serves it from the same process, so the
# service URL itself is the complete app. The GitHub Pages frontend keeps working too, as long
# as this service keeps its URL (it was built against https://pulsehr-api-n7il.onrender.com).
#
# Free tier caveat: the service sleeps after 15 min idle; the next request takes ~30-60 s.
services:
  - type: web
    name: pulsehr-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node scripts/demo.mjs
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PULSEHR_JWT_SECRET
        generateValue: true
